name: macos-installer-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/macos/**'
      - 'server.py'
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'context/**'
      - '.github/workflows/macos-installer-smoke.yml'

jobs:
  build-and-smoke-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installer artifacts
        run: |
          chmod +x scripts/macos/build_macos_installer.sh scripts/macos/postinstall
          ./scripts/macos/build_macos_installer.sh

      - name: Verify artifacts exist
        run: |
          test -d dist/macos/JobSearchCoach.app
          test -f dist/macos/JobSearchCoach-unsigned.pkg
          test -f dist/macos/JobSearchCoach-unsigned.dmg

      - name: Install pkg
        run: |
          sudo installer -pkg dist/macos/JobSearchCoach-unsigned.pkg -target /
          sync

      - name: Validate app bundle exists
        run: |
          if ! test -d /Applications/JobSearchCoach.app; then
            echo "ERROR: app bundle missing. /Applications contents:"
            ls /Applications/ || true
            exit 1
          fi

      - name: Validate launcher is executable
        run: test -x /Applications/JobSearchCoach.app/Contents/MacOS/JobSearchCoach

      - name: Validate server.py is present
        run: test -f /Applications/JobSearchCoach.app/Contents/Resources/app/server.py

      - name: Python compile check in installed payload
        run: |
          python3 - <<'PY'
          import py_compile
          py_compile.compile(
              '/Applications/JobSearchCoach.app/Contents/Resources/app/server.py',
              cfile='/tmp/jobsearchcoach-server.pyc',
              doraise=True,
          )
          print('PY_COMPILE_OK')
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jobsearchcoach-macos-artifacts
          path: dist/macos/*
